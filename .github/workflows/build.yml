# Tests, builds and packages Zephyron for every platform it ships on, one
# runner each. When everything passes, a push to main whose pubspec.yaml
# version has no release yet publishes every package, with checksums, as the
# GitHub release v<version>; bump the version to ship the next one. A pushed
# tag `v*` publishes the same way, and a version with a hyphen, like
# 1.2.0-beta.1, is marked as a pre-release.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what this run ships
        id: pick
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
            publish=false
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
                echo "::notice::v$version is already released; bump the version in pubspec.yaml to publish another"
              else
                publish=true
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"


  secrets:
    name: Secret hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Refuse tracked secrets
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|(^|/)key\.properties$|\.(jks|keystore|p12)$' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret files must never be committed:"
            echo "$tracked"
            exit 1
          fi

  quality:
    name: Format, analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install SQLite for the database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Keep the coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  build:
    name: ${{ matrix.name }}
    needs: [ version, secrets, quality ]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Android, runner: ubuntu-24.04, platform: android }
          - { name: iOS, runner: macos-15, platform: ios }
          - { name: macOS, runner: macos-15, platform: macos }
          - { name: Windows x64, runner: windows-2025, platform: windows }
          - { name: Linux x64, runner: ubuntu-24.04, platform: linux }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install the Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

      # Stores want a plain x.y.z, so a pre-release suffix is kept in file
      # names only.
      - name: Choose the version
        shell: bash
        run: |
          echo "NAME=${VERSION%%-*}" >> "$GITHUB_ENV"
          echo "NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          mkdir -p bin

      # freeRASP closes a release build whose signing certificate does not
      # match APP_CERT_HASH, so the hash is read from the very key that signs
      # this build rather than kept as a separate secret that can drift.
      - name: Restore the Android signing key
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -n "$KEYSTORE_BASE64" ]; then
            store="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$store"
            {
              echo "storeFile=$store"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            alias="$KEY_ALIAS"
            password="$KEYSTORE_PASSWORD"
          else
            if [ "$PUBLISH" = true ]; then
              echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets to publish; a debug-signed release could never be updated in place"
              exit 1
            fi
            echo "::notice::No signing key configured; this build is debug-signed"
            store="$HOME/.android/debug.keystore"
            if [ ! -f "$store" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -keystore "$store" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            alias=androiddebugkey
            password=android
          fi
          digest=$(keytool -exportcert -keystore "$store" -storepass "$password" -alias "$alias" \
            | openssl dgst -sha256 -binary | base64)
          echo "::add-mask::$digest"
          echo "CERTIFICATE=$digest" >> "$GITHUB_ENV"

      # Build defines come from repository secrets and live only on the
      # runner; forks and pull requests build without them.
      - name: Write build defines
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          umask 077
          APP_CERT_HASH="${CERTIFICATE:-}"
          file="$RUNNER_TEMP/release.env"
          : > "$file"
          for key in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY APP_CERT_HASH GIPHY_API_KEY; do
            if [ -n "${!key}" ]; then echo "$key=${!key}" >> "$file"; fi
          done
          if [ -s "$file" ]; then
            echo "DEFINES=--dart-define-from-file=$file" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get

      - name: Package for Android
        if: matrix.platform == 'android'
        env:
          SHA256_SIGNATURE: ${{ secrets.SHA256_SIGNATURE }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "$NAME" --build-number "$NUMBER" \
            --obfuscate --split-debug-info=build/symbols $DEFINES
          flutter build apk --release \
            --build-name "$NAME" --build-number "$NUMBER" \
            --obfuscate --split-debug-info=build/symbols $DEFINES
          flutter build appbundle --release \
            --build-name "$NAME" --build-number "$NUMBER" \
            --obfuscate --split-debug-info=build/symbols $DEFINES
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "bin/zephyron-$VERSION-android-$abi.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk "bin/zephyron-$VERSION-android-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "bin/zephyron-$VERSION-android.aab"

      # Without an Apple signing identity this is an unsigned archive, for
      # sideloading or re-signing with your own certificate.
      - name: Package for iOS
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign \
            --build-name "$NAME" --build-number "$NUMBER" $DEFINES
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/bin/zephyron-$VERSION-ios-unsigned.ipa" Payload)

      - name: Package for macOS
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release \
            --build-name "$NAME" --build-number "$NUMBER" $DEFINES
          app=build/macos/Build/Products/Release/zephyron.app
          ditto -c -k --keepParent "$app" "bin/zephyron-$VERSION-macos-universal.zip"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$app" "$RUNNER_TEMP/dmg/Zephyron.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname Zephyron -srcfolder "$RUNNER_TEMP/dmg" \
            -ov -format UDZO "bin/zephyron-$VERSION-macos-universal.dmg"

      - name: Package for Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $defines = @()
          if ($env:DEFINES) { $defines += $env:DEFINES }
          flutter build windows --release `
            --build-name "$env:NAME" --build-number "$env:NUMBER" @defines
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $release = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$release\*" -DestinationPath "bin\zephyron-$env:VERSION-windows-x64.zip"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:NAME" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\$release" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\bin" `
            "/DOutputName=zephyron-$env:VERSION-windows-x64-setup" `
            windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package for Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release \
            --build-name "$NAME" --build-number "$NUMBER" $DEFINES
          bundle=build/linux/x64/release/bundle
          tar -C "$bundle" -czf "bin/zephyron-$VERSION-linux-x64.tar.gz" .

          root="$RUNNER_TEMP/deb"
          mkdir -p "$root/DEBIAN" "$root/opt/zephyron" "$root/usr/bin" \
            "$root/usr/share/applications" "$root/usr/share/icons/hicolor/512x512/apps"
          cp -R "$bundle/." "$root/opt/zephyron/"
          ln -s /opt/zephyron/zephyron "$root/usr/bin/zephyron"
          cp linux/packaging/zephyron.desktop "$root/usr/share/applications/"
          cp web/icons/Icon-512.png "$root/usr/share/icons/hicolor/512x512/apps/zephyron.png"
          release="$(echo "$VERSION" | tr '-' '~')"
          cat > "$root/DEBIAN/control" <<EOF
          Package: zephyron
          Version: $release
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Aveloux <security@aveloux.com>
          Depends: libgtk-3-0, libsecret-1-0, libjsoncpp25
          Homepage: https://github.com/${{ github.repository }}
          Description: Private peer-to-peer messaging over Tor
           Decentralized chat between trustees over Tor onion services.
          EOF
          dpkg-deb --build --root-owner-group "$root" "bin/zephyron-$VERSION-linux-amd64.deb"

      - name: Remove secrets from the runner
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.env"

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: zephyron-${{ matrix.platform }}
          path: bin/*
          if-no-files-found: error

      - name: Keep the Android debug symbols
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-android
          path: build/symbols
          retention-days: 90

  release:
    name: Release
    if: needs.version.outputs.publish == 'true'
    needs: [ version, build ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin
          pattern: zephyron-*
          merge-multiple: true

      - name: Checksum the packages
        working-directory: bin
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Zephyron ${{ needs.version.outputs.version }}
          files: bin/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
