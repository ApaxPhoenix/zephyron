# Tests, builds and packages Zephyron on every platform and architecture a
# release ships for, one runner each: Android and iOS, macOS as one universal
# app, and Windows and Linux on x64 and on ARM64, since Flutter builds for
# the machine it runs on. Every package is versioned as the VERSION file
# says. A release is release.yml's: once this workflow passes on main with a
# VERSION not yet released, it ships what this run packaged.
#
# Flutter is the release FLUTTER_VERSION names, cloned from its own
# repository and kept between runs, so the ARM runners get it too: Flutter's
# downloadable archives are x64 only on Windows and Linux.
#
# Build defines come from the repository's secrets -- CLOUDFLARE_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, APP_CERT_HASH and GIPHY_API_KEY --
# and live only on the runner; forks and pull requests build without them.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  secrets:
    name: Secret hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Refuse tracked secrets
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|(^|/)key\.properties$|\.(jks|keystore|p12)$' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret files must never be committed:"
            echo "$tracked"
            exit 1
          fi

  quality:
    name: Format, analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Flutter
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Flutter
        run: |
          if [ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install SQLite for the database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Keep the coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  # Tor runs inside the iOS app, so this boots it on a simulator, publishes
  # an onion service and reaches it through Tor, the way one phone reaches
  # another. A release waits for it like any other job.
  simulator:
    name: Tor on iOS
    needs: [ secrets, quality ]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Cache Flutter
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Flutter
        run: |
          if [ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - run: flutter pub get

      - name: Boot an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available --json |
            jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$device"
          echo "DEVICE=$device" >> "$GITHUB_ENV"

      - name: Reach an onion service through Tor
        run: flutter test integration_test/tor_test.dart -d "$DEVICE"

  build:
    name: ${{ matrix.name }}
    needs: [ secrets, quality ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `debian` and `rpm` are the architecture's names in those package
          # formats.
          - { name: Android, runner: ubuntu-24.04, platform: android, architecture: universal }
          - { name: iOS, runner: macos-15, platform: ios, architecture: arm64 }
          - { name: macOS, runner: macos-15, platform: macos, architecture: universal }
          - { name: Windows x64, runner: windows-2025, platform: windows, architecture: x64 }
          - { name: Windows ARM64, runner: windows-11-arm, platform: windows, architecture: arm64 }
          - { name: Linux x64, runner: ubuntu-24.04, platform: linux, architecture: x64, debian: amd64, rpm: x86_64 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, platform: linux, architecture: arm64, debian: arm64, rpm: aarch64 }

    steps:
      - uses: actions/checkout@v7

      # VERSION's first line names every package; stores want a plain x.y.z,
      # so a pre-release suffix is kept in file names only.
      - name: Choose the version
        shell: bash
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=${version%%-*}" >> "$GITHUB_ENV"
          echo "NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          mkdir -p bin

      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Flutter
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Flutter
        shell: bash
        run: |
          if [ ! -d "$RUNNER_TEMP/flutter/bin" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Windows ]; then
            "$RUNNER_TEMP/flutter/bin/flutter.bat" --version
          else
            "$RUNNER_TEMP/flutter/bin/flutter" --version
          fi

      - name: Install the Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev rpm zip

      # freeRASP closes a release build whose signing certificate does not
      # match APP_CERT_HASH, so on Android the hash is read from the very key
      # that signs this build. An APP_CERT_HASH secret that names another key
      # is reported and set aside rather than shipped in an app that would
      # close itself.
      - name: Restore the Android signing key
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_CERT_HASH: ${{ secrets.APP_CERT_HASH }}
        run: |
          umask 077
          if [ -n "$KEYSTORE_BASE64" ]; then
            store="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$store"
            {
              echo "storeFile=$store"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            alias="$KEY_ALIAS"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No signing key configured, so this build is signed with a key made for this run and cannot update an installed release"
            store="$HOME/.android/debug.keystore"
            if [ ! -f "$store" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -keystore "$store" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            alias=androiddebugkey
            password=android
          fi
          digest=$(keytool -exportcert -keystore "$store" -storepass "$password" -alias "$alias" \
            | openssl dgst -sha256 -binary | base64)
          echo "::add-mask::$digest"
          if [ -n "$APP_CERT_HASH" ] && [ "$APP_CERT_HASH" != "$digest" ]; then
            echo "::warning::APP_CERT_HASH names another signing key than the one signing this build, so the build uses this key's own hash"
          fi
          echo "CERTIFICATE=$digest" >> "$GITHUB_ENV"

      - name: Write build defines
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APP_CERT_HASH: ${{ secrets.APP_CERT_HASH }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          umask 077
          APP_CERT_HASH="${CERTIFICATE:-$APP_CERT_HASH}"
          file="$RUNNER_TEMP/release.env"
          : > "$file"
          for key in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY APP_CERT_HASH GIPHY_API_KEY; do
            if [ -n "${!key}" ]; then echo "$key=${!key}" >> "$file"; fi
          done
          if [ -s "$file" ]; then
            echo "DEFINES=--dart-define-from-file=$file" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get

      - name: Package for Android
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "$NAME" --build-number "$NUMBER" \
            --obfuscate --split-debug-info=build/symbols $DEFINES
          flutter build apk --release \
            --build-name "$NAME" --build-number "$NUMBER" \
            --obfuscate --split-debug-info=build/symbols $DEFINES
          flutter build appbundle --release \
            --build-name "$NAME" --build-number "$NUMBER" \
            --obfuscate --split-debug-info=build/symbols $DEFINES
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "bin/zephyron-$VERSION-android-$abi.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk "bin/zephyron-$VERSION-android-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "bin/zephyron-$VERSION-android.aab"

      # Without an Apple signing identity this is an unsigned archive, for
      # sideloading or re-signing with your own certificate. When Xcode
      # fails, Flutter only says to pick a signing team, so a failed build
      # runs again verbosely to show Xcode's own error.
      - name: Package for iOS
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign \
            --build-name "$NAME" --build-number "$NUMBER" $DEFINES || {
            flutter build ios --release --no-codesign --verbose \
              --build-name "$NAME" --build-number "$NUMBER" $DEFINES 2>&1 |
              grep -i -E -B3 -A12 'error:|failed|bad state' | tail -200
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/bin/zephyron-$VERSION-ios-unsigned.ipa" Payload)

      # One app for Apple silicon and Intel alike, as a disk image, an
      # installer package and two archives. None of them is signed.
      - name: Package for macOS
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release \
            --build-name "$NAME" --build-number "$NUMBER" $DEFINES
          products=build/macos/Build/Products/Release
          app="$products/zephyron.app"
          ditto -c -k --keepParent "$app" "bin/zephyron-$VERSION-macos-universal.zip"
          tar -C "$products" -czf "bin/zephyron-$VERSION-macos-universal.tar.gz" zephyron.app
          productbuild --component "$app" /Applications "bin/zephyron-$VERSION-macos-universal.pkg"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$app" "$RUNNER_TEMP/dmg/Zephyron.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname Zephyron -srcfolder "$RUNNER_TEMP/dmg" \
            -ov -format UDZO "bin/zephyron-$VERSION-macos-universal.dmg"

      # WiX 7 for the .msi, with its EULA accepted for this runner. Accepting
      # it is the project's choice, made here: see
      # https://docs.firegiant.com/wix/osmf/.
      - name: Set up WiX
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7

      - name: Package for Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $defines = @()
          if ($env:DEFINES) { $defines += $env:DEFINES }
          flutter build windows --release `
            --build-name "$env:NAME" --build-number "$env:NUMBER" @defines
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $release = "build\windows\${{ matrix.architecture }}\runner\Release"
          Compress-Archive -Path "$release\*" `
            -DestinationPath "bin\zephyron-$env:VERSION-windows-${{ matrix.architecture }}.zip"
          wix build windows\installer.wxs -arch ${{ matrix.architecture }} `
            -d "Version=$env:NAME" -d "Source=$env:GITHUB_WORKSPACE\$release" `
            -o "bin\zephyron-$env:VERSION-windows-${{ matrix.architecture }}.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # WiX leaves its debug data beside the installer; nobody installs that.
          Remove-Item "bin\*.wixpdb"

      # The bundle under /opt/zephyron with a launcher, as a .deb and an .rpm,
      # and as two archives.
      - name: Package for Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release \
            --build-name "$NAME" --build-number "$NUMBER" $DEFINES
          bundle="$GITHUB_WORKSPACE/build/linux/${{ matrix.architecture }}/release/bundle"
          tar -C "$bundle" -czf "bin/zephyron-$VERSION-linux-${{ matrix.architecture }}.tar.gz" .
          (cd "$bundle" && zip -qr "$GITHUB_WORKSPACE/bin/zephyron-$VERSION-linux-${{ matrix.architecture }}.zip" .)

          root="$RUNNER_TEMP/root"
          mkdir -p "$root/opt/zephyron" "$root/usr/bin" \
            "$root/usr/share/applications" "$root/usr/share/icons/hicolor/512x512/apps"
          cp -R "$bundle/." "$root/opt/zephyron/"
          ln -s /opt/zephyron/zephyron "$root/usr/bin/zephyron"
          cp linux/packaging/zephyron.desktop "$root/usr/share/applications/"
          cp web/icons/Icon-512.png "$root/usr/share/icons/hicolor/512x512/apps/zephyron.png"

          deb="$RUNNER_TEMP/deb"
          cp -R "$root" "$deb"
          mkdir -p "$deb/DEBIAN"
          cat > "$deb/DEBIAN/control" <<EOF
          Package: zephyron
          Version: $(echo "$VERSION" | tr '-' '~')
          Section: net
          Priority: optional
          Architecture: ${{ matrix.debian }}
          Maintainer: Aveloux <security@aveloux.com>
          Depends: libgtk-3-0, libsecret-1-0, libjsoncpp25
          Homepage: https://github.com/${{ github.repository }}
          Description: Private peer-to-peer messaging over Tor
           Decentralized chat between trustees over Tor onion services.
          EOF
          dpkg-deb --build --root-owner-group "$deb" "bin/zephyron_${VERSION}_${{ matrix.debian }}.deb"

          # The bundle goes in as built: Flutter's libraries keep their
          # symbols, and nothing is added to them.
          top="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$top/SPECS"
          cat > "$top/SPECS/zephyron.spec" <<EOF
          Name: zephyron
          Version: $(echo "$NAME" | tr '-' '~')
          Release: 1
          Summary: Private peer-to-peer messaging over Tor
          License: AGPL-3.0-only
          URL: https://github.com/${{ github.repository }}
          Requires: gtk3, libsecret, jsoncpp
          AutoReqProv: no
          %global debug_package %{nil}
          %global __os_install_post %{nil}
          %global _build_id_links none

          %description
          Decentralized chat between trustees over Tor onion services.

          %install
          mkdir -p %{buildroot}
          cp -a $root/. %{buildroot}/

          %files
          /opt/zephyron
          /usr/bin/zephyron
          /usr/share/applications/zephyron.desktop
          /usr/share/icons/hicolor/512x512/apps/zephyron.png
          EOF
          rpmbuild --define "_topdir $top" -bb "$top/SPECS/zephyron.spec"
          cp "$top"/RPMS/*/*.rpm "bin/zephyron-$VERSION-1.${{ matrix.rpm }}.rpm"

      - name: Remove secrets from the runner
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.env"

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: zephyron-${{ matrix.platform }}-${{ matrix.architecture }}
          path: bin/*
          if-no-files-found: error

      - name: Keep the Android debug symbols
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-android
          path: build/symbols
          retention-days: 90
